name: SIA Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout SIA
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build debug and minified test release APKs
        run: gradle --no-daemon --max-workers=1 assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Upload SIA APK
        uses: actions/upload-artifact@v4
        with:
          name: SIA-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload SIA test release APK
        uses: actions/upload-artifact@v4
        with:
          name: SIA-Test-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload SIA Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: SIA-Android-App-Bundle
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Publish public test APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0-test app/build/outputs/apk/release/*.apk \
            --title "SIA v0.1.0 Test APK" \
            --notes "Pre-release testing build of SIA. Signed with the Android debug key for local testing only. This is not a production release. Review requested permissions before installing; Play Protect may still warn or block this app." \
            --prerelease
